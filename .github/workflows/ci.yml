name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build without cgo
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Assert the binary is statically linked
        env:
          CGO_ENABLED: 0
        run: |
          go build -o frank .
          file frank | tee /dev/stderr | grep -q "statically linked"

      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      # The race detector is the one place cgo is required. The shipped binary is
      # built with CGO_ENABLED=0 above; this only affects the test process.
      - name: Verify the acceptance ledger names tests that exist and pass
        env:
          CGO_ENABLED: 1
          LEDGER_RUN_TESTS: "1"
        run: ./scripts/verify-ledger.sh

      - name: Prove the acceptance tests can fail
        env:
          CGO_ENABLED: 1
        run: ./scripts/prove-tests-bite.sh

      - name: Test with the race detector
        env:
          CGO_ENABLED: 1
        run: go test -race ./...
